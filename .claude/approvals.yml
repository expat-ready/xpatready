      - "**/*[-_.0-9][Ff][Ee][Ee][Ss]"
      - "**/*[-_.0-9][Ff][Ee][Ee][Ss]/**"
      - "**/*[-_.0-9][Ff][Ee][Ee][Ss][-_.0-9]*"
