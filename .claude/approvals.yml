# Claude Approvals policy (lab lane ship-security, 27 Nov 2026). Design, sources and the switch plan:
# ai-workers/problem-1-pathway-setup-and-form-filling/product/design/ship-security-2026-11-27.md
# Schema: https://code.claude.com/docs/en/approvals-policy (read 27 Nov 2026). Paths: product/tools/lead-read-paths.txt as
# globs; product/tools/check-approvals-paths.sh (ci) proves every file it names lands in the right tier.
#
# Claude is the approver GitHub records (P-849, founder 27 Nov: no machine user). Three tiers, as P-823:
#   routine     Claude approves; no review, no seat, not billed. The reviewer agent's Approve still gates the merge
#               through the label (queue-gate.sh) during the overlap.
#   read-after  money, schema and migrations, public routes: Claude approves once claude/code_review passes (billed as
#               Code Review); the Lead reads after the merge (queue-gate's "Lead after-read owed"). A destructive
#               migration stays read-first through queue-gate.sh destructive(), which a path rule cannot see.
#   read-first  pipeline, review rules, permissions: Claude approves only after its review passes AND a member of
#               expat-ready/tech-lead posts `@claude approve <head sha>` (the Lead's read).
# observe (billed): the Claude Approvals check only shows what these rules would decide, ends neutral and Claude posts
# no approving review; the read-after and read-first reviews still run and bill. Delete `mode: observe` in the switch
# PR, together with the GitHub rule "1 approval + dismiss stale approvals" and Mergify's conditions, never alone.
version: 1
mode: observe
locals:
  # The Lead's read: an approval (`@claude approve <sha>` or a review) from the team expat-ready/tech-lead. The Lead
  # works from the account that authors every PR, so the author is not excluded here; queue-gate.sh also withholds the
  # label from these paths until the Lead has read them.
  lead: { count: 1, from: [expat-ready/tech-lead] }
rules:
  - purpose: "Routine product and records work: Claude approves; the reviewer's Approve and ci gate the merge."
    paths:
      - "**"
      - "!.github/**"
      - "!.mergify.yml"
      - "!.githooks/**"
      - "!CLAUDE.md"
      - "!AGENTS.md"
      - "!ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/**"
      - "!ai-workers/problem-1-pathway-setup-and-form-filling/product/screens/B119/**"
      - "!ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/tools/**"
      - "!**/prisma.config.*"
      - "!**/.claude/**"
      - "!**/api/src/platform/identity/**"
      - "!**/api/src/core.ts"
      - "!**/api/src/platform/firm-scope.ts"
      - "!**/api/src/platform/terms/gate.ts"
      - "!**/api/src/features/platform-terms.ts"
      - "!**/studio/samples/notification-groups.json"
      - "!**/*[Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn]*"
      - "!**/*[Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn]*/**"
      - "!**/api/src/**/*[Pp][Uu][Bb][Ll][Ii][Cc]*"
      - "!**/web/src/**/*-[Pp][Uu][Bb][Ll][Ii][Cc]/**"
      - "!**/prisma/schema/**"
      - "!**/prisma/migrations/**"
      - "!**/*[Mm][Oo][Nn][Ee][Yy]*"
      - "!**/*[Mm][Oo][Nn][Ee][Yy]*/**"
      - "!**/*[Pp][Rr][Ii][Cc]*"
      - "!**/*[Pp][Rr][Ii][Cc]*/**"
      - "!**/*[Bb][Ii][Ll][Ll][Ii][Nn][Gg]*"
      - "!**/*[Bb][Ii][Ll][Ll][Ii][Nn][Gg]*/**"
      - "!**/*[Pp][Aa][Yy][Mm][Ee][Nn][Tt]*"
      - "!**/*[Pp][Aa][Yy][Mm][Ee][Nn][Tt]*/**"
      - "!**/*[Ss][Tt][Rr][Ii][Pp][Ee]*"
      - "!**/*[Ss][Tt][Rr][Ii][Pp][Ee]*/**"
      - "!**/*[Ii][Nn][Vv][Oo][Ii][Cc][Ee]*"
      - "!**/*[Ii][Nn][Vv][Oo][Ii][Cc][Ee]*/**"
      - "!**/*[Ll][Ee][Dd][Gg][Ee][Rr]*"
      - "!**/*[Ll][Ee][Dd][Gg][Ee][Rr]*/**"
      - "!**/[Ff][Ee][Ee]"
      - "!**/[Ff][Ee][Ee]/**"
      - "!**/[Ff][Ee][Ee][-_.0-9]*"
      - "!**/[Ff][Ee][Ee][-_.0-9]*/**"
      - "!**/*[-_.0-9][Ff][Ee][Ee]"
      - "!**/*[-_.0-9][Ff][Ee][Ee]/**"
      - "!**/*[-_.0-9][Ff][Ee][Ee][-_.0-9]*"
      - "!**/*[-_.0-9][Ff][Ee][Ee][-_.0-9]*/**"
      - "!**/[Ff][Ee][Ee][Ss]"
      - "!**/[Ff][Ee][Ee][Ss]/**"
      - "!**/[Ff][Ee][Ee][Ss][-_.0-9]*"
      - "!**/[Ff][Ee][Ee][Ss][-_.0-9]*/**"
      - "!**/*[-_.0-9][Ff][Ee][Ee][Ss]"
      - "!**/*[-_.0-9][Ff][Ee][Ee][Ss]/**"
      - "!**/*[-_.0-9][Ff][Ee][Ee][Ss][-_.0-9]*"
      - "!**/*[-_.0-9][Ff][Ee][Ee][Ss][-_.0-9]*/**"
      - "!**/api/src/{ai,rounds,review-runs,review-run-shapes,finder-cost,people-ai}.ts"
    verdict: { claude: approves, seats: 0 }

  - purpose: "Read first: pipeline files need the Lead's read and Claude's review."
    paths:
      - ".github/**"
      - ".mergify.yml"
      - ".githooks/**"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/screens/B119/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/tools/**"
      - "**/prisma.config.*"
    verdict: { claude: comments, seats: ["@lead"] }
    override:
      - { if: "claude/code_review = pass", verdict: { claude: approves, seats: ["@lead"] } }

  - purpose: "Read first: the review rules and agent settings, in every folder."
    paths:
      - "**/.claude/**"
    nested: inherit
    verdict: { claude: comments, seats: ["@lead"] }
    override:
      - { if: "claude/code_review = pass", verdict: { claude: approves, seats: ["@lead"] } }

  - purpose: "Read first: permissions and identity."
    paths:
      - "**/api/src/platform/identity/**"
      - "**/api/src/core.ts"
      - "**/api/src/platform/firm-scope.ts"
      - "**/api/src/platform/terms/gate.ts"
      - "**/api/src/features/platform-terms.ts"
      - "**/studio/samples/notification-groups.json"
      - "**/*[Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn]*"
      - "**/*[Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn]*/**"
    verdict: { claude: comments, seats: ["@lead"] }
    override:
      - { if: "claude/code_review = pass", verdict: { claude: approves, seats: ["@lead"] } }

  - purpose: "Read after (P-823): public routes, once Claude's review passes."
    paths:
      - "**/api/src/**/*[Pp][Uu][Bb][Ll][Ii][Cc]*"
      - "**/web/src/**/*-[Pp][Uu][Bb][Ll][Ii][Cc]/**"
    verdict: { claude: comments, seats: 0 }
    override:
      - { if: "claude/code_review = pass", verdict: { claude: approves, seats: 0 } }

  - purpose: "Read after (P-823): schema and migrations, once Claude's review passes (destructive ones stay read-first in queue-gate)."
    paths:
      - "**/prisma/schema/**"
      - "**/prisma/migrations/**"
    verdict: { claude: comments, seats: 0 }
    override:
      - { if: "claude/code_review = pass", verdict: { claude: approves, seats: 0 } }

  - purpose: "Read after (P-823): money (fees, prices, client money, billing, invoices, payments, ledgers, paid model runs), once Claude's review passes."
    paths:
      - "**/*[Mm][Oo][Nn][Ee][Yy]*"
      - "**/*[Mm][Oo][Nn][Ee][Yy]*/**"
      - "**/*[Pp][Rr][Ii][Cc]*"
      - "**/*[Pp][Rr][Ii][Cc]*/**"
      - "**/*[Bb][Ii][Ll][Ll][Ii][Nn][Gg]*"
      - "**/*[Bb][Ii][Ll][Ll][Ii][Nn][Gg]*/**"
      - "**/*[Pp][Aa][Yy][Mm][Ee][Nn][Tt]*"
      - "**/*[Pp][Aa][Yy][Mm][Ee][Nn][Tt]*/**"
      - "**/*[Ss][Tt][Rr][Ii][Pp][Ee]*"
