      - "**/[Ff][Ee][Ee][Ss]/**"
      - "**/[Ff][Ee][Ee][Ss][-_.0-9]*"
      - "**/[Ff][Ee][Ee][Ss][-_.0-9]*/**"
      - "**/*[-_.0-9][Ff][Ee][Ee][Ss]"
      - "**/*[-_.0-9][Ff][Ee][Ee][Ss]/**"
