# .claude/approvals.yml: the Claude Approvals policy (lab register LR-144; founder decision P-849, 27 Nov).
# Schema: code.claude.com/docs/en/approvals-policy, approvals-setup, approvals-github-rules (read 28 Nov 2026).
# Read from main only: a change here counts once merged, and this file is on the tech lead's read-first paths.
#
# P-849: no GitHub bot account; Claude Approvals is the approver GitHub records (it counts toward the "1 approval"
# rule). On money, schema, migration, permission and pipeline paths Claude Code Review must pass first; the Lead's
# after-merge read stays (P-823). When a second person joins, they take the human seat: then raise `seats`.
#   * No seat for people (`seats: 0`) and no "!pr/authors" set: every PR is opened by the founder's account, which
#     GitHub never counts as its own approver, so such a seat could never be filled (gap research finding 1).
#   * Approvals takes the strictest verdict of the rules that apply ("blocks outranks comments, which outranks
#     approves"), so a PR touching one risky path gets the risky rule's verdict.
#   * claude/code_review is named ONLY in the risky rules' override (gap research finding 2: a policy naming it
#     "can start a billed Code Review when a pull request opens and at each push"); routine PRs start none.
#   * mode: observe: the "Claude Approvals" check shows what these rules WOULD decide and blocks nothing; "observe
#     mode is billed" (approvals-setup). Enforcing is a later, separate step (delete the mode line) after the observe
#     week (LR-144 Done when) and the switch (LR-072).
#   * The gate is Claude's approving review, not the check: with `claude: comments` and no seat the "Claude Approvals"
#     check itself passes on a risky PR whose Code Review failed; only Claude's approval is withheld, so P-849 holds
#     through GitHub's "1 approval" rule (LR-072). A Mergify condition on the check alone would not hold it; switching
#     the risky rules to `claude: blocks` (the check fails until Code Review passes) is the tech lead's call at the switch.
#   * Risky globs name folders too (`**/*word*/**`): `*` stays in one folder, so `**/*word*` matches file names only.
#   * reuse across a main-merge push is LR-148 (lane ship-security-2), built on this file.
# product/tools/check-approvals-policy.sh (ci) checks these points.
version: 1
mode: observe
rules:
  - purpose: "Every change: Claude approves with no review (P-849); ci, pr-suites and the reviewer agent stay the gate."
    paths: ["**"]
    verdict: { claude: approves, seats: 0 }

  - purpose: "Client money, fees, payments, trust, invoices, billing, plans and entitlements: Claude approves only after Code Review passes."
    paths:
      - "**/client-money/**"
      - "**/client-money-*"
      - "**/client-money.prisma"
      - "**/*fees*"
      - "**/*-fee.*"
      - "**/*-fee-*"
      - "**/fee-*"
      - "**/*payment*"
      - "**/*trust*"
      - "**/*invoice*"
      - "**/*refund*"
      - "**/*billing*"
      - "**/*ledger*"
      - "**/*pric*"
      - "**/*stripe*"
      - "**/*stripe*/**"
      - "**/*money*"
      - "**/*money*/**"
      - "**/billing/**"
      - "**/*billing*/**"
      - "**/*payment*/**"
      - "**/*invoice*/**"
      - "**/*trust*/**"
      - "**/*ledger*/**"
      - "**/*refund*/**"
      - "**/*fees*/**"
      - "**/entitlements/**"
      - "**/*entitlement*"
      - "**/*plan-change*"
      - "**/*plan-change*/**"
      - "**/*cost-check*"
      - "**/cost-gate.ts"
      - "**/currencies.ts"
    verdict: { claude: comments, seats: 0 }
    override:
      - { if: "claude/code_review = pass", verdict: { claude: approves, seats: 0 } }

  - purpose: "The database schema and migrations: Claude approves only after Code Review passes."
    paths:
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/prisma/**"
      - "**/prisma.config.*"
    verdict: { claude: comments, seats: 0 }
    override:
      - { if: "claude/code_review = pass", verdict: { claude: approves, seats: 0 } }

  - purpose: "Permissions, roles, identity (staff and system), firm scope and its bypasses, secrets and access checks: Claude approves only after Code Review passes."
    paths:
      - "**/*permission*"
      - "**/*role*"
      - "**/platform/identity/**"
      - "**/*identity*"
      - "**/*case-access*"
      - "**/audit/access/**"
      - "**/platform/firm-scope.ts"
      - "**/platform/terms/gate.ts"
      - "**/features/platform-terms.ts"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/api/src/core.ts"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/api/src/**/*public*"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/web/src/**/*-public/**"
      - "**/system-identity/**"
      - "**/*identity*/**"
      - "**/*permission*/**"
      - "**/*.bypass.ts"
      - "**/*audit-access*"
      - "**/firm-lock/**"
      - "**/*firm-wall*"
      - "**/secret-box/**"
      - "**/*secret-box*"
      - "**/config/secret.ts"
      - "**/*-scope.ts"
      - "**/staff-read/**"
      - "**/ports/staff.ts"
      - "**/contracts/session.ts"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/web/src/modules/system/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/web/src/modules/platform/staff/**"
    verdict: { claude: comments, seats: 0 }
    override:
      - { if: "claude/code_review = pass", verdict: { claude: approves, seats: 0 } }

  - purpose: "No-sign-in doors (a route a person reaches signed out: public pages, sign-in, links, sign-up, health) and the logic behind them: Claude approves only after Code Review passes. check-approvals-policy.sh A8 finds every file that declares such a route and fails until a strict rule covers it."
    paths:
      - "**/front-office/booking/consultation-agreement/**"
      - "**/front-office/booking/tokens.ts"
      - "**/front-office/sales/embed.ts"
      - "**/front-office/signing/door*"
      - "**/front-office/signing/fake-page.ts"
      - "**/platform/branding/routes.ts"
      - "**/platform/firms/routes.ts"
      - "**/platform/firms/signup*"
      - "**/platform/messages/demo-inbox.ts"
      - "**/*unsubscribe*.ts"
      - "**/front-office/signing/hooks.ts"
      - "**/platform/web-address/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/api/src/health.ts"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/api/src/main.ts"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/api/src/person-link.ts"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/api/src/screen02.ts"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/api/src/features/platform-branding.ts"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/api/src/features/platform-firms.ts"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/api/src/features/platform-messages.ts"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/api/src/features/platform-signup-links.ts"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/api/src/features/platform-web-address.ts"
    verdict: { claude: comments, seats: 0 }
    override:
      - { if: "claude/code_review = pass", verdict: { claude: approves, seats: 0 } }

  - purpose: "The pipeline, deploy and the rules agents follow (workflows, merge queue, hooks and the scripts they run, guards, review rules): Claude approves only after Code Review passes; no PR loosens its own judge."
    paths:
      - ".github/**"
      - ".mergify.yml"
      - ".githooks/**"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "REVIEW.md"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/tools/**"
      - "ai-workers/tools/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/deploy/**"
      - "**/Dockerfile*"
    verdict: { claude: comments, seats: 0 }
    override:
      - { if: "claude/code_review = pass", verdict: { claude: approves, seats: 0 } }

  - purpose: "The review rules and agent settings, this file included, at any depth: Claude approves only after Code Review passes."
    paths: ["**/.claude/**"]
    nested: inherit
    verdict: { claude: comments, seats: 0 }
    override:
      - { if: "claude/code_review = pass", verdict: { claude: approves, seats: 0 } }
