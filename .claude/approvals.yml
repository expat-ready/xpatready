      - "**/*[Bb][Ii][Ll][Ll][Ii][Nn][Gg]*"
      - "**/*[Bb][Ii][Ll][Ll][Ii][Nn][Gg]*/**"
      - "**/*[Pp][Aa][Yy][Mm][Ee][Nn][Tt]*"
      - "**/*[Pp][Aa][Yy][Mm][Ee][Nn][Tt]*/**"
      - "**/*[Ss][Tt][Rr][Ii][Pp][Ee]*"
      - "**/*[Ss][Tt][Rr][Ii][Pp][Ee]*/**"
      - "**/*[Ii][Nn][Vv][Oo][Ii][Cc][Ee]*"
      - "**/*[Ii][Nn][Vv][Oo][Ii][Cc][Ee]*/**"
      - "**/*[Ll][Ee][Dd][Gg][Ee][Rr]*"
      - "**/*[Ll][Ee][Dd][Gg][Ee][Rr]*/**"
      - "**/[Ff][Ee][Ee]"
      - "**/[Ff][Ee][Ee]/**"
