# Merge queue with batches (P-201, founder 31 Oct). An approved PR enters the queue; Mergify combines up to 2 of them
# (6 until P-715, 19 Nov) the way they will land on main, runs the full check once on that batch PR (branch
# mergify/merge-queue/...), and merges them all when it passes. A failing batch is split (at most 2 rounds) until the PR
# that broke it is found; the others still merge. Since P-715 the queue runs in parallel by scope (below); the history
# of serial checking follows.
# P-210 (founder 1 Nov, the free fix): one batch checked at a time (the Mac has one test runner: stacked batches were
# cancelled whenever one ahead failed, 43% of its time on 31 Oct), batches of up to 6, and a PR joins only once its own
# check is green, so a batch fails only on how PRs combine.
# Founder 1 Nov night (reverses P-210's limit of one): the repository is public, so batches run free on GitHub's
# machines, not the one Mac; up to 6 batches are checked at once, each assuming the ones ahead of it pass.
merge_queue:
  max_parallel_checks: 4   # Lead 4, 22 Nov 15:47 IST (pipeline fix, P-214): 12 to 4. At 15:44 IST 10 batches ran at once, each with
  # 17-27 jobs waiting for a machine: 113 jobs running, 163 workflow runs queued, nothing merged since 14:35 IST. Fewer
  # batches at a time let the front batches finish instead of all starving. 12 was CI-SPEED-1 (founder A253, 21 Nov),
  # set when 74 jobs ran with no shortage; load has since doubled. Earlier: 6 (P-739), 3 (CK-1).
  # P-715 (Lead 84; founder P-717, 19 Nov ~07:3x IST, the one exception to the P-716 freeze): batches that share no
  # scope test and merge at the same time, and one failure no longer resets the others. Undo: mode: serial (one line).
  # Design and evidence: product/design/mergify-parallel-scopes-2026-11-19.md (40% of 118 batches failed in 72 h).
  mode: parallel

# Scopes: the fenced modules, as their module cards claim them (.claude/rules/modules, product/tools/module-cards.py),
# plus each module's own schema file; migrations one at a time PER AREA (SPD-2; capacity 1: a second migration failed queued PRs 60%
# of the time, design/merge-queue-causes-2026-11-16.md); pipeline work (checks, workflows, Mergify, tools, agent rules)
# its own lane, never batched with product (P-717 (a)). A PR in no scope (web, the unfenced api files, tests, engine,
# unscoped schema files) is batched only with other scope-less PRs, untested on top of the module lanes: the design's
# largest cross-scope risk.
# barrier_files are the seams every module builds on: a PR touching one conflicts with every scope, so the queue
# serializes at it. A new or changed blocking check, or a stricter step inside ci, starts report-only (P-717 (b)): it
# joins no queue_conditions or
# merge_conditions here, and no required check in the ruleset, until it has run clean for 24 h or 10 PR runs; Mergify
# has no time-based condition, so the tech lead adds it then, in its own PR.
