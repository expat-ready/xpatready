# One product queue (D1, P-416, founder 8 Nov ~09:05 IST "Approve all stands"): M2 is 60/60 (P-415), so the two queues
# of 4 Nov (M2 first, M3 picked by a hand-kept title regex, which went stale whenever an M3 row was added) are one
# queue "product"; every condition the two shared stays. git history has the m2/m3 split.
# Records never block code (B119, P-376 (1), founder 6 Nov; one route, Lead 21's ruling on #1147, 6 Nov): a second queue
# "records", listed last (lowest priority), takes a PR labelled "records". CI applies that label to a records-only PR
# (tools/records-only.sh, P-371 (4), #1139: every file is a record under product/, not product/tools/, and not code),
# so there is one definition of a record. product skips the label. A records PR is checked only when no product
# PR waits ahead of it, and a product PR that arrives goes ahead of it, so a records merge never restarts a product batch;
# records also never share a batch with code. Records merge only through this queue, never outside it.
# Exception, P-664 (founder 17 Nov, "Yes, verdicts first (Recommended)"; reverses B119 / P-376 (1) for verdict records
# only): a queue "verdicts", listed FIRST, takes a qa verdict records PR: labelled "records", title starting "qa:" (the
# qa skill's commit and PR title form) and changing qa/CAPABILITIES.md (a verdict moves a capability row). Every other
# records PR still goes to "records", last. The title, not the branch, selects qa: of the 7 records PRs touching
# CAPABILITIES.md among the last 300 closed PRs (17 Nov), all 7 had a "qa:" title and none a claude/qa- branch (cloud
# sessions name their own branches). No allow_checks_interruption: Mergify's default inserts a higher-priority PR just
# after the batches whose checks already run, so a verdict never restarts a running product batch.
# product/screens/B119/check-queue-rules.py reads this file and fails when the queues stop routing that way. The daily
# records PR (P-336) stays.
queue_rules:
  - name: verdicts
    batch_size: 2   # P-715: was 6; a failed batch bounces at most one other PR
    batch_max_failure_resolution_attempts: 2
    batch_max_wait_time: 2 min
    queue_conditions:
      - base = main
      - -draft
      - "label = review: approved"
      - check-success = ci
      - label = records
      - "title ~= ^qa:"
      - files ~= qa/CAPABILITIES\.md$
    merge_conditions:
      - check-success = ci
    merge_method: merge
  # SPD-1 (founder 22 Nov to Lead 4: "separate queues for track A, B, C ... strongly enforced"; P-802): a PR is routed
  # by the paths it touches (product/tools/track-paths.txt, the one list). A Track A file and no Track B file: queue
  # track-a; a Track B file and no Track A file: queue track-b (files of neither track may ride along). Files of both
  # tracks, or app files of neither: the shared queue product below. Each track queue batches only its own PRs (batch
  # size 3); with mode parallel, a track batch whose scopes differ from the other track's checks and merges beside it.
  # Not yet everywhere: front-office (sales and booking in A, retainers and signing in B) and platform (files in B) are
  # one scope each, and audit.prisma is a barrier file, so such batches still serialize (a scope split is its own PR).
  # Priority is file order: track-a, then track-b, then product (both tracks or neither). Separate queue rules, not Mergify
  # partitions: the partition docs could not be read from the cloud lane (docs.mergify.com blocked), and these rules
  # keep every condition product has, so no gate is lowered. Each keeps product's queue and merge conditions word for
  # word (test-spd-1.sh checks it). Undo: delete the two queues (PRs fall back to product).
  - name: track-a
    batch_size: 3   # SPD-1 (P-802): its own batches, 3 a batch to start
    batch_max_failure_resolution_attempts: 2
    batch_max_wait_time: 5 min
    queue_conditions:
      - base = main
      - -draft
      - "label = review: approved"
      - check-success = ci
      - -label=records
      - files ~= ^(?!(\.github/|\.githooks/|\.mergify\.yml$|\.claude/|AGENTS\.md$|CLAUDE\.md$|ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/))
      - or:
          - check-success = xfa-engine
          - -files ~= ^(packages/xfa-engine/|tsconfig\.base\.json$|\.nvmrc$|\.github/workflows/xfa-engine\.yml$)
      - or:
          - check-success = queue-fresh
          - -files ~= /prototype/
      # SPD-1: Track A (platform, audit, front-office sales and booking, web platform): a file of this track (product/tools/track-paths.txt) and none of the other track's.
      # Generated: python3 -I product/tools/track-route.py regex track-a (test-spd-1.sh fails on drift).
      - 'files ~= ^ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/(?!(?:api/src/platform/files/.*)$)(?:api/src/platform/.*|prisma/schema/platform\.prisma|prisma/schema/platform-[^/]*\.prisma|prisma/schema/audit\.prisma|ports/audit\.ts|api/src/features/platform-[^/]*\.ts|api/src/features/audit-[^/]*\.ts|api/src/front-office/sales/.*|api/src/front-office/booking/.*|api/src/front-office/booking-seed\.ts|prisma/schema/front-office-sales\.prisma|prisma/schema/front-office-booking\.prisma|web/src/modules/platform/.*|tests/check_pf[^/]*|tests/check_aud[^/]*)$'
      - '-files ~= ^ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/(?:api/src/client-money/.*|prisma/schema/client-money\.prisma|api/src/runtime\.ts|api/src/clients\.ts|api/src/case-[^/]*\.ts|api/src/case-clients/[^/]*\.ts|api/src/case-deadlines/[^/]*\.ts|api/src/search/[^/]*\.ts|api/src/case-notes/[^/]*\.ts|api/src/assessments\.ts|api/src/team\.ts|api/src/person-link\.ts|api/src/employer-[^/]*\.ts|api/src/earlier-facts\.ts|api/src/findings\.ts|api/src/readiness\.ts|api/src/readiness-inputs\.ts|api/src/document-review-[^/]*\.ts|api/src/filing\.ts|api/src/filing-[^/]*\.ts|api/src/fill-case\.ts|api/src/submission\.ts|api/src/submission-record\.ts|api/src/sign-steps\.ts|api/src/review-rounds\.ts|api/src/review-runs\.ts|api/src/review-run-shapes\.ts|api/src/review-stamp\.ts|api/src/review-items\.ts|api/src/release-[^/]*\.ts|api/src/stage-scope\.ts|api/src/routes-data\.ts|prisma/schema/cases\.prisma|prisma/schema/case-search\.prisma|prisma/schema/filings\.prisma|prisma/schema/evidence\.prisma|prisma/schema/submission\.prisma|prisma/schema/review\.prisma|api/src/platform/files/.*|api/src/front-office/retainers/.*|api/src/front-office/signing/.*|prisma/schema/front-office-retainers\.prisma|prisma/schema/front-office-signing\.prisma|api/src/features/client-money-[^/]*\.ts|api/src/features/case-[^/]*\.ts|tests/check_cs[^/]*|tests/check_case_[^/]*)$'
    merge_conditions:
      - check-success = ci
      - or:
          - check-success = skeleton
          - -files ~= ^ai-workers/problem-1-pathway-setup-and-form-filling/prototype/(studio/(api|web|engine|contracts|prisma|samples|deploy)/|studio/(package\.json|package-lock\.json|prisma\.config\.ts|Dockerfile|Dockerfile\.dockerignore|tools/skeleton-smoke\.sh)$|contracts/|p2/[^/]+\.ts$|p5/.*\.ts$|env/node/)
    merge_method: merge
  - name: track-b
    batch_size: 3   # SPD-1 (P-802): its own batches, 3 a batch to start
    batch_max_failure_resolution_attempts: 2
    batch_max_wait_time: 5 min
    queue_conditions:
      - base = main
      - -draft
      - "label = review: approved"
      - check-success = ci
      - -label=records
      - files ~= ^(?!(\.github/|\.githooks/|\.mergify\.yml$|\.claude/|AGENTS\.md$|CLAUDE\.md$|ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/))
      - or:
          - check-success = xfa-engine
          - -files ~= ^(packages/xfa-engine/|tsconfig\.base\.json$|\.nvmrc$|\.github/workflows/xfa-engine\.yml$)
      - or:
          - check-success = queue-fresh
          - -files ~= /prototype/
      # SPD-1: Track B (client money, case side, front-office retainers and signing, platform files): a file of this track (product/tools/track-paths.txt) and none of the other track's.
      # Generated: python3 -I product/tools/track-route.py regex track-b (test-spd-1.sh fails on drift).
      - 'files ~= ^ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/(?:api/src/client-money/.*|prisma/schema/client-money\.prisma|api/src/runtime\.ts|api/src/clients\.ts|api/src/case-[^/]*\.ts|api/src/case-clients/[^/]*\.ts|api/src/case-deadlines/[^/]*\.ts|api/src/search/[^/]*\.ts|api/src/case-notes/[^/]*\.ts|api/src/assessments\.ts|api/src/team\.ts|api/src/person-link\.ts|api/src/employer-[^/]*\.ts|api/src/earlier-facts\.ts|api/src/findings\.ts|api/src/readiness\.ts|api/src/readiness-inputs\.ts|api/src/document-review-[^/]*\.ts|api/src/filing\.ts|api/src/filing-[^/]*\.ts|api/src/fill-case\.ts|api/src/submission\.ts|api/src/submission-record\.ts|api/src/sign-steps\.ts|api/src/review-rounds\.ts|api/src/review-runs\.ts|api/src/review-run-shapes\.ts|api/src/review-stamp\.ts|api/src/review-items\.ts|api/src/release-[^/]*\.ts|api/src/stage-scope\.ts|api/src/routes-data\.ts|prisma/schema/cases\.prisma|prisma/schema/case-search\.prisma|prisma/schema/filings\.prisma|prisma/schema/evidence\.prisma|prisma/schema/submission\.prisma|prisma/schema/review\.prisma|api/src/platform/files/.*|api/src/front-office/retainers/.*|api/src/front-office/signing/.*|prisma/schema/front-office-retainers\.prisma|prisma/schema/front-office-signing\.prisma|api/src/features/client-money-[^/]*\.ts|api/src/features/case-[^/]*\.ts|tests/check_cs[^/]*|tests/check_case_[^/]*)$'
      - '-files ~= ^ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/(?!(?:api/src/platform/files/.*)$)(?:api/src/platform/.*|prisma/schema/platform\.prisma|prisma/schema/platform-[^/]*\.prisma|prisma/schema/audit\.prisma|ports/audit\.ts|api/src/features/platform-[^/]*\.ts|api/src/features/audit-[^/]*\.ts|api/src/front-office/sales/.*|api/src/front-office/booking/.*|api/src/front-office/booking-seed\.ts|prisma/schema/front-office-sales\.prisma|prisma/schema/front-office-booking\.prisma|web/src/modules/platform/.*|tests/check_pf[^/]*|tests/check_aud[^/]*)$'
    merge_conditions:
      - check-success = ci
      - or:
          - check-success = skeleton
          - -files ~= ^ai-workers/problem-1-pathway-setup-and-form-filling/prototype/(studio/(api|web|engine|contracts|prisma|samples|deploy)/|studio/(package\.json|package-lock\.json|prisma\.config\.ts|Dockerfile|Dockerfile\.dockerignore|tools/skeleton-smoke\.sh)$|contracts/|p2/[^/]+\.ts$|p5/.*\.ts$|env/node/)
    merge_method: merge
  # The shared queue (SPD-1): a PR touching both tracks, or app files in neither track.
  - name: product
    batch_size: 2   # P-715: was 6; a failed batch bounces at most one other PR
    batch_max_failure_resolution_attempts: 2
    # F6 (founder 6 Nov, "Yes, apply all seven"): a 24-hour trial of 5 min (was 2 min), so batches fill; review 7 Nov
    # ~21:00 IST: kept if PRs per batch rises (baseline 1.6) and approved-to-merged median does not get worse.
    batch_max_wait_time: 5 min
    queue_conditions:
      - base = main
      - -draft
      - "label = review: approved"
      - check-success = ci
      - -label=records
      # P-717 (a): a PR whose every file is pipeline work goes to the queue "pipeline" below, never a product batch.
      - files ~= ^(?!(\.github/|\.githooks/|\.mergify\.yml$|\.claude/|AGENTS\.md$|CLAUDE\.md$|ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/))
      # B170a (#1545, reviewer minor 5; Lead 18, P-214): a PR that changes the XFA engine (the paths that start
      # .github/workflows/xfa-engine.yml) also needs that workflow's own check green; ci does not run the engine's tests.
      - or:
          - check-success = xfa-engine
          - -files ~= ^(packages/xfa-engine/|tsconfig\.base\.json$|\.nvmrc$|\.github/workflows/xfa-engine\.yml$)
      # B194 (founder 16 Nov, measured in product/design/merge-queue-causes-2026-11-16.md): a PR touching the app also
      # needs the status queue-fresh (queue-gate.yml, product/tools/queue-gate.sh). It is "failure" while main has merged
      # a PR touching one of the same app files, or a second migration, since the PR's green ci started (35% of such
      # PRs failed in the queue, 60% for two migrations, against 17%); the PR's ci is re-run on today's main first.
      # A queued PR keeps success. To switch it off, delete these four lines.
      - or:
          - check-success = queue-fresh
          - -files ~= /prototype/
    merge_conditions:
      - check-success = ci
      # QA-449 part 2 (R1.16; P-717 (b), Lead 4 series 3, 20 Nov): skeleton ran clean on 10 merge batches since #2517,
      # so a red container proof now blocks a product batch. Guarded: a batch that touches none of skeleton.yml's
      # `paths` gets no skeleton run and is not held. Keep this regex in step with skeleton.yml's `paths` block.
      - or:
          - check-success = skeleton
          - -files ~= ^ai-workers/problem-1-pathway-setup-and-form-filling/prototype/(studio/(api|web|engine|contracts|prisma|samples|deploy)/|studio/(package\.json|package-lock\.json|prisma\.config\.ts|Dockerfile|Dockerfile\.dockerignore|tools/skeleton-smoke\.sh)$|contracts/|p2/[^/]+\.ts$|p5/.*\.ts$|env/node/)
    merge_method: merge
  # P-717 (a), founder 19 Nov ~07:3x IST: pipeline work (checks, workflows, Mergify, tools, agent rules) has its own
  # lane. Every file of the PR is a pipeline path; with the scope "pipeline" (capacity 1) it never shares a batch with
  # product code and, after product in priority, never holds a product PR back. The XFA engine rule applies here too.
  - name: pipeline
    batch_size: 2
    batch_max_failure_resolution_attempts: 2
    batch_max_wait_time: 2 min
    queue_conditions:
      - base = main
      - -draft
      - "label = review: approved"
      - check-success = ci
      - -label=records
      - -files ~= ^(?!(\.github/|\.githooks/|\.mergify\.yml$|\.claude/|AGENTS\.md$|CLAUDE\.md$|ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/))
      - or:
          - check-success = xfa-engine
          - -files ~= ^(packages/xfa-engine/|tsconfig\.base\.json$|\.nvmrc$|\.github/workflows/xfa-engine\.yml$)
    merge_conditions:
      - check-success = ci
    merge_method: merge
  - name: records
    batch_size: 2   # P-715: was 6; a failed batch bounces at most one other PR
    batch_max_failure_resolution_attempts: 2
    batch_max_wait_time: 2 min
    queue_conditions:
      - base = main
      - -draft
      - "label = review: approved"
      - check-success = ci
      - label = records
    merge_conditions:
      - check-success = ci
    merge_method: merge

# -draft (P-371 (1), founder 6 Nov): a draft never joins a batch; a draft runs only the push guard. Records PRs carry the
# label "records", set by records-label.yml (main's tools/records-only.sh; before 7 Nov ci.yml's job "kind"); the
# "records" queue that selects it, and the "-label=records"
# that keeps it out of product, are B119's (#1147, Lead 21's ruling, 6 Nov; see above).

# Approved PRs join the queue by themselves (the queue_conditions above decide which); no "@mergifyio queue" needed.
merge_protections_settings:
  auto_merge_conditions: true
