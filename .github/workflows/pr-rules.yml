# PR body and size rules (P-611, row G-4 (2), (3), (6); P-526, P-606, P-608, P-610): the body has a "Done when" that
# names its test and a "Duplicate check:" line; the PR is under 800 changed lines, tests included, unless the body names
# an exception: the label "size: exception" with a line "Size exception: <reason>" (P-857 (5)), or a recorded row
# ("Size exception: P-NNN"); every agent, skill and hook agrees on Opus 5.5 medium (P-788). Re-runs when the
# body is edited. Merge-queue PRs (mergify/*) carry a generated body and are skipped; a records-only PR (by its file
# list, records-only.sh; their own queue) passes with the rule steps skipped. No "labeled": a label must never re-run
# the check the queue waits on (as ci.yml, review 6 Nov).
# An item's last PR says "Completes: R1.77" on a line of its own (several: "Completes: R1.77, R1.78"); at its merge
# item-proof.yml runs the item's pack and journey and posts the verdict (P-728 (3)); an unreadable line fails here.
# A runtime/screens PR whose title names an R1 row and whose body has no such line gets a MISSING warning (A274).
# The product queue waits for this check (E6, P-772; .mergify.yml). Reads only, US$0.
# B204 (P-745): job outside-wave labels a PR naming an R1 item outside the open waves (design/waves.tsv) "outside-wave",
# with a warning, never a failure (fixes still merge, P-214). It holds the only write token here, so it runs main's
# waves.py from the base commit in a folder of its own, reads the PR's title and body as data only, and keeps no
# token in .git/config (tools/write-token.py, ALLOW).
# LR-043 (lab bundle A3, fail closed): a rule that cannot read its input, errors or times out fails the check, never
# passes it; a rule whose verdict is a warning by design still only warns. The body and title are read from GitHub at the
# run (pr-rules-read.sh), so a re-run sees the body as it is now. LR-141: a money, schema, permission or pipeline PR
# carries a short explainer (explainer-check.py). Test of these: product/tools/check-pr-rules-closed.sh.
# Test: product/tools/check-g4-rules.sh. E5 (P-674 to P-677): cleanup-pr-check.sh proves a "Clean-up:" PR is a pure
# move or deletion and runs the stale-path check on every PR (test: product/tools/check-cleanup-pr.sh).
name: pr-rules
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read   # the PR's file list, to count code and test lines only (P-610 reading, Lead 58 15 Nov)
concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-rules:
    # E6 (P-772, review of #2595): the product queue waits for this check, so the job always runs on a PR and never reads
    # the "records" label from the event: records-label.yml drops that label on the same push that adds code, after
    # this job read it, and a label change by GITHUB_TOKEN starts no run, so a skipped run could hold an approved
    # product PR out of the queue for good. The first step asks records-only.sh about the PR's own file list instead; a
    # records-only PR passes with every rule step skipped (its own queue does not wait for pr-rules).
    if: "${{ !startsWith(github.event.pull_request.head.ref, 'mergify/') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      T: ai-workers/problem-1-pathway-setup-and-form-filling/product/tools
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the merge commit and its first parent (main), for cleanup-pr-check.sh
      # LR-043: BODY and TITLE for every later step, read now (a re-run replays the old event's body: #2282's false
      # failure); a failed read fails here and sets nothing.
      - name: read the PR's body and title as they are now (fails closed)
        env:
          GH_TOKEN: "${{ github.token }}"
          N: "${{ github.event.pull_request.number }}"
        run: bash "$T/pr-rules-read.sh"
      - name: records only? (records-only.sh on the PR's file list; then the rule steps are skipped and the check passes)
        id: rec
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -o pipefail   # an unreadable file list is "not records": the rules run, never a silent pass
          REC=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' | bash "$T/records-only.sh" is-records --files) || REC=no
          echo "records=$REC" >> "$GITHUB_OUTPUT"; echo "records only: $REC"
      - name: body has a testable Done when and a Duplicate check line
        if: "${{ steps.rec.outputs.records != 'yes' }}"
        run: printf '%s\n' "$BODY" | bash "$T/brief-check.sh"
      - name: a "Completes:" line, if any, names R1 items only (P-728 (3); item-proof.yml proves them at the merge)
        if: "${{ !cancelled() && steps.rec.outputs.records != 'yes' }}"
        run: printf '%s\n' "$BODY" | node ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/tools/item-proof.mjs detect
      - name: a runtime/screens PR whose title names an R1 row has a "Completes:" line (A274; a warning until the Lead adds --strict on)
        if: "${{ !cancelled() }}"
        run: printf '%s\n' "$BODY" | node ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/tools/item-proof.mjs claim --title "$TITLE"
      - name: a money, permission or migration PR names the decision or requirement of each rule, "Rules settled:" (A348; a warning, never a failure)
        if: "${{ !cancelled() && steps.rec.outputs.records != 'yes' }}"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -o pipefail   # test: product/tools/check-rules-settled.sh
          if gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/rs-files"; then
            printf '%s\n' "$BODY" | python3 -I "$T/rules-settled.py" --files "$RUNNER_TEMP/rs-files" || { echo "::error title=Rules settled (A348)::the check could not run, so this step fails (LR-043, fail closed)"; exit 1; }
          else echo "::warning title=Rules settled (A348)::the PR's file list could not be read, so the rules were not checked and this step fails (LR-043, fail closed)"; exit 1; fi
      - name: a "Clean-up:" PR is a pure move or deletion; no live file names a moved path (E5, P-674 to P-677)
        if: "${{ !cancelled() }}"
        run: printf '%s\n' "$BODY" | bash "$T/cleanup-pr-check.sh" --base HEAD^1
      - name: existing checks this PR removes or changes, listed for the reviewer, "Checks changed:" says why (A351 C2; a warning, never a failure)
        if: "${{ !cancelled() && steps.rec.outputs.records != 'yes' }}"
        # Test: product/tools/check-checks-changed.sh.
        run: printf '%s\n' "$BODY" | timeout 30 python3 -I "$T/checks-changed.py" --base HEAD^1 --summary "$GITHUB_STEP_SUMMARY" || { r=$?; echo "::error title=Checks changed (A351 C2)::the check could not run or ran out of time (exit $r), so this step fails (LR-043, fail closed)"; exit 1; }
      - name: under 800 changed lines of code and tests, or a size exception (label and reason, P-857; or a recorded row)
        if: "${{ !cancelled() && steps.rec.outputs.records != 'yes' }}"
        env:
          GH_TOKEN: "${{ github.token }}"
        # P-610 reading (Lead 58, 15 Nov, on #1824): generated review, break and journey records under product/screens/
        # and product/qa/ are not counted; everything else is.
        run: |
          set -o pipefail   # a failed or partial file list must fail the step, never pass as a small count (Devin review on #1834)
          CODE=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | select(.filename | test("/product/(screens|qa)/") | not) | .additions + .deletions' | awk '{s+=$1} END {print s+0}')
          # P-686: a records-only PR (every path, both sides of a rename, a record by records-only.sh) is not size-limited.
          REC=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' | bash "$T/records-only.sh" is-records --files) || REC=no
          # P-857 (5): the label "size: exception" with a "Size exception: <reason>" body line passes over 800. Read from
          # GitHub now (no "labeled" trigger, see the top); a failed read fails the step (LR-043, fail closed).
          NAMES=$(gh api --paginate "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" --jq '.[].name') \
            || { echo "::error title=size (P-857)::the PR's labels could not be read, so this step fails (LR-043, fail closed)"; exit 1; }
          LAB=no; grep -qxF 'size: exception' <<< "$NAMES" && LAB=yes
          printf '%s\n' "$BODY" | bash "$T/pr-size.sh" "$CODE" 0 "$REC" "$LAB"
      # One model rule (P-788, A420): settings, agent files, skills, instruction files and the two hooks agree on
      # Opus 5.5 medium; any disagreement fails, naming the file and line. Runs on records-only PRs too: WAY-OF-WORKING.md
      # is a record the Lead edits, and the check reads it. Test: product/tools/check-model-rule.sh.
      - name: one model rule, Opus 5.5 medium (P-788)
        if: "${{ !cancelled() }}"
        run: python3 -I "$T/model-rule-check.py"
      # OS-78 (a) (OS P1): every issue_comment workflow skips, at the job, a comment without its words (no runner per
      # comment). Test: product/tools/check-comment-filter.sh.
      - name: comment-triggered workflows filter at the job (OS-78 (a))
        if: "${{ !cancelled() }}"
        run: python3 -I "$T/comment-filter-check.py"
      # LR-156 (founder A433/A434; P-388): a records PR, or any PR from a lead/* branch, is cut from main under 24 h before
      # main's tip, so the Lead never writes records on a stale branch. Runs on records-only PRs too (that is its point):
      # there it is a red pr-rules for the Lead to see, since the records queue waits only on ci (.mergify.yml); on a
      # lead/* PR in the product queue it blocks the merge.
      # Reads GitHub's compare answer (base_commit, merge_base_commit); the shas reach it only through env. Test:
      # product/tools/check-lead-age.sh.
      - name: a records or lead/* branch is under 24 h old against main (LR-156)
        if: "${{ !cancelled() && (steps.rec.outputs.records == 'yes' || startsWith(github.event.pull_request.head.ref, 'lead/')) }}"
        env:
          GH_TOKEN: "${{ github.token }}"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          gh api "repos/${{ github.repository }}/compare/${BASE_SHA}...${HEAD_SHA}" | bash "$T/lead-age.sh" ci-json
      - name: every R1 item of CAPABILITIES.md has one wave in design/waves.tsv (B204; a warning, never a failure)
        if: "${{ !cancelled() }}"
        # A missing wave (exit 1, "WAVES LIST:") warns; waves.py crashing or unable to read its files fails (LR-043).
        run: |
          r=0; out=$(python3 -I "$T/waves.py" ids 2>&1) || r=$?
          printf '%s\n' "$out"
          if [ "$r" = 1 ] && [ "${out#WAVES LIST:}" != "$out" ]; then echo "::warning title=waves list::a new R1 row needs a wave in design/waves.tsv (P-745)"
          elif [ "$r" != 0 ]; then echo "::error title=waves list::waves.py could not check the list (exit $r), so this step fails (LR-043, fail closed)"; exit 1; fi
      # LR-141 (founder 27 Nov): a money, schema, permission or pipeline PR has an "Explainer" with what changed, why and
      # what could break. A file list that cannot be read fails (bash -e). Test: product/tools/check-pr-rules-closed.sh.
      - name: a money, schema, permission or pipeline PR carries a plain-words explainer (LR-141)
        if: "${{ !cancelled() && steps.rec.outputs.records != 'yes' }}"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -o pipefail
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/ex-files"
          printf '%s\n' "$BODY" | python3 -I "$T/explainer-check.py" --files "$RUNNER_TEMP/ex-files"
      # E16 (STANDARDS §1, P-553, P-587): a package added to any package.json needs a "STANDARDS §1:" line (the technology gate).
      # Test: product/tools/check-deps-line.sh.
      - name: a new package in any package.json carries a "STANDARDS §1:" line (E16)
        if: "${{ !cancelled() }}"
        run: printf '%s\n' "$BODY" | bash "$T/deps-line-check.sh" --base HEAD^1
  # ENF-782a part 1 (P-782 (2), founder 21 Nov): a PR saying "Completes: R1.n" fails unless every part listed for R1.n
  # (its focus-list.md line, its J-row's "Parts it joins:", its CAPABILITIES.md packs and suites) has merged on main or
  # is this PR, and its journey tests/journeys/j_<n>.ts exists on main or in this PR; the failure names each missing
  # part. Report-only for 2 h after ready-gate.py reaches main, then blocking: the product queue has
  # "-check-failure = completes-ready" (.mergify.yml), so a failed run keeps the PR out and a missing run stalls nobody.
  # Kill switch: repository variable READY_GATE=report. A part merging later does not re-run it: edit the body or push.
  # Reads only, US$0; the body and title reach the script only through env. Test: product/tools/check-ready-gate.sh.
  # LR-043: no label in its condition. A skipped job counts as a pass for "-check-failure", and a "records" label read
  # from the event can be stale (records-label.yml drops it on the push that adds code, E6), so a product PR could skip
  # the gate; a records PR has no "Completes:" line, so the gate passes it anyway.
  completes-ready:
    if: "${{ !startsWith(github.event.pull_request.head.ref, 'mergify/') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # main's PR merge commits: which parts have merged, and when the gate reached main
          filter: blob:none
          persist-credentials: false
      - name: read the PR's body and title as they are now (fails closed, LR-043)
        env:
          GH_TOKEN: "${{ github.token }}"
          N: "${{ github.event.pull_request.number }}"
        run: bash ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/pr-rules-read.sh
      - name: every part of a "Completes:" item is on main or this PR, and its journey exists (P-782 (2))
        env:
          READY_GATE: "${{ vars.READY_GATE }}"
        run: printf '%s\n' "$BODY" | python3 -I ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/ready-gate.py
  outside-wave:
    if: "${{ !startsWith(github.event.pull_request.head.ref, 'mergify/') && !contains(github.event.pull_request.labels.*.name, 'records') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write   # the label outside-wave only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: an item outside the open waves is flagged with the label outside-wave, never failed (B204, P-745; P-214)
        env:
          GH_TOKEN: "${{ github.token }}"
          TITLE: "${{ github.event.pull_request.title }}"
          BODY: "${{ github.event.pull_request.body }}"
          N: "${{ github.event.pull_request.number }}"
          HAS: "${{ contains(github.event.pull_request.labels.*.name, 'outside-wave') }}"
        run: |
          r=0; out=$(printf '%s\n%s\n' "$TITLE" "$BODY" | python3 -I base/ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/waves.py pr 2>&1) || r=$?
          if [ "$r" = 1 ] && [ "${out#OUTSIDE WAVE}" != "$out" ]; then   # a crash (Python traceback) is not a flag
            while IFS= read -r l; do echo "::warning title=outside-wave::$l"; done <<< "$out"
            [ "$HAS" = true ] || gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$N/labels" -f 'labels[]=outside-wave' >/dev/null \
              || echo "::warning title=outside-wave::the label could not be added"
          elif [ "$r" = 0 ]; then
            [ "$HAS" = true ] && { gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$N/labels/outside-wave" >/dev/null || true; }
          else echo "::warning title=waves.py::could not check the waves ($out)"; fi
          exit 0
