# Tests of the Lead's ENF-783a tools (P-783 (1)): review-rounds.py (a third reviewer round fails, the Lead's "Lead allows
# round 3:" line passes) and lead-pr.sh's label and requeue steps on a stand-in GitHub. Runs only when one of them, a
# test or this file changes. Also ENF-798's self-test of the founder's rules of 22 Nov (P-798 triggers, P-800 flow buffer,
# P-801 sources). Advisory (not a Mergify condition). No network, US$0, under 1 minute.
name: lead-tools-tests
on:
  pull_request:
    # SPD-2 item 5 (b): a draft runs only the light checks (ci's guard, pr-rules, module-cards); this runs on ready-for-review.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/review-rounds.py"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/test_review_rounds.py"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/lead-pr.sh"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/check-lead-pr.sh"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/guard-test-lib.sh"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/test-enf-798.sh"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/sle-watch.py"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/app-view.js"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/step-age.py"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/flow-buffer.py"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/brief-check.sh"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/lead-watch.sh"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/lead-queue.sh"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/local-lanes.sh"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/source-check.py"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/app-view-check.sh"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/app-view-save.sh"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/flow-measure.py"
      - ".github/workflows/lead-tools-tests.yml"
      - ".github/workflows/review-rounds.yml"
permissions:
  contents: read
concurrency:
  group: lead-tools-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ !startsWith(github.event.pull_request.head.ref, 'mergify/') }}   # SPD-2 item 5: a newer push supersedes; a merge-queue batch never
jobs:
  tests:
    if: "${{ !github.event.pull_request.draft || startsWith(github.event.pull_request.head.ref, 'mergify/') }}"   # SPD-2 item 5 (b): not on a draft (a merge-queue batch is a draft and still runs it)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      T: ai-workers/problem-1-pathway-setup-and-form-filling/product/tools
    steps:
      - uses: actions/checkout@v4
      - name: review-round limit
        run: python3 -I "$T/test_review_rounds.py"
      - name: lead-pr.sh label and requeue
        run: bash "$T/check-lead-pr.sh"
      - name: ENF-798 founder rules of 22 Nov (P-798, P-800, P-801), twice
        run: bash "$T/test-enf-798.sh" && bash "$T/test-enf-798.sh"
