# Founder's board data checks (P-596, spec §6.9): the unit tests of tools/cockpit-data.py on hand-made fixtures, the
# invariants and schema on the fixture snapshot, and the independent reconciliation on the same snapshot. Runs only when
# the board's script, tests, fixtures or page change. One Linux machine, about a minute, US$0 (P-528, B190).
name: cockpit-tests
on:
  pull_request:
    # SPD-2 item 5 (b): a draft runs only the light checks (ci's guard, pr-rules, module-cards); this runs on ready-for-review.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/cockpit-*"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/test_cockpit_data.py"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/flow-measure.py"   # the board's pipeline and review-rounds feed
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/test_flow_measure.py"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/fixtures/cockpit/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/cockpit/**"
      - ".github/workflows/cockpit-tests.yml"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/human-sample.py"   # P-782 (1): the weekly human sample lead-watch prints
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/test_human_sample.py"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/measures.py"   # lab: DORA five, works, tokens
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/test_measures.py"
permissions:
  contents: read
concurrency:
  group: cockpit-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ !startsWith(github.event.pull_request.head.ref, 'mergify/') }}   # SPD-2 item 5: a newer push supersedes; a merge-queue batch never
jobs:
  test:
    if: "${{ !github.event.pull_request.draft || startsWith(github.event.pull_request.head.ref, 'mergify/') }}"   # SPD-2 item 5 (b): not on a draft (a merge-queue batch is a draft and still runs it)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      P: ai-workers/problem-1-pathway-setup-and-form-filling/product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: jsonschema (the data contract's validator)
        run: pip install jsonschema==4.26.0
      - name: unit tests (hand-worked numbers on the fixtures)
        run: python3 -m unittest "$P/tools/test_cockpit_data.py" -v
      - name: flow-measure's Release 1 measures (ENF-782b, P-782 (3); hand-worked numbers, no network)
        run: python3 -I "$P/tools/test_flow_measure.py"
      - name: invariants, schema and reconciliation on the fixture snapshot
        run: |
          out="$RUNNER_TEMP/cockpit"
          mkdir -p "$out"
          python3 "$P/tools/cockpit-data.py" --out "$out/data.json" --from-snapshot "$P/tools/fixtures/cockpit/snapshot" --offline --no-history-write
          python3 - "$out/data.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          bad = [i["name"] for i in d["trust"]["invariants"] if not i["ok"]]
          print("trust:", d["trust"]["state"], "| invariants broken:", bad or "none")
          sys.exit(1 if bad or d["trust"]["state"] == "disagree" else 0)
          PY
      - name: human sample states (ENF-782b part 2, P-782 (1); due, open, yes, no, overdue; no network)
        run: python3 -I "$P/tools/test_human_sample.py"
      - name: measures.py (DORA five, works per day, tokens per capability; hand-worked numbers, no network)
        run: python3 -I "$P/tools/test_measures.py"
