# PF-7 (walking skeleton, contracts 2026-11-14 §1.3 and §5.5): the app builds into one container image from a clean
# clone, compose starts it beside PostgreSQL, migrations apply, and tools/skeleton-smoke.sh proves it: /api/health and
# the first page answer 200, the image runs as a non-root user and holds no secret; then a seeded fail (the database
# stopped) must make the smoke script fail on health. The Canadian cloud deploy is PF-8.
# When (B190, CI minutes): only a pull request whose change touches what goes into the image (the paths below), not
# while it is a draft (P-371 (1): ready runs it), and by hand. A records-only PR matches no path, so no run starts.
# GitHub judges `paths` on the PR's whole diff, so a later push to a code PR always starts a run; step "changes" then
# reads what that one push changed (before..after) against the same list, read from this file, and skips the build in
# words only when the push touched none of it (records only, say) AND this workflow's run at the earlier head
# concluded success (checked through the API, never assumed: a red or replaced earlier run means a full run).
# Keep the `paths` block plain: one `      - "glob"` per line, no comments or blank lines inside it (the step refuses them).
# Mergify's batch PRs (mergify/*, drafts) do not run it: each PR proved its image; it is not a required check.
# A ready head's run is never cancelled (P-371 (2)): a newer push waits. US$0 (public repository), no model spend,
# no key: the database has no password and live AI is off.
# PF-8a: job deploy-synth (below) checks the CDK estate in deploy/ when a PR changes it; a PR that touches none of the
# image's paths (deploy/ and records) builds no image (step "changes" skips it), nor does a push touching only deploy/.
name: skeleton
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/api/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/web/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/engine/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/contracts/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/prisma/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/samples/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/package.json"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/package-lock.json"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/prisma.config.ts"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/Dockerfile"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/Dockerfile.dockerignore"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/deploy/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/tools/skeleton-smoke.sh"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/contracts/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/p2/*.ts"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/p5/**/*.ts"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/env/node/**"
      - "deploy/**"
      - ".github/workflows/skeleton.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read   # step "changes" reads this workflow's earlier run (conclusion only)
concurrency:
  group: skeleton-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  skeleton:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      S: ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio
      COMPOSE: ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/deploy/compose.test.yml
      SKELETON_PORT: "4480"
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }   # one commit: step "changes" fetches the two it compares itself

      - name: changes (did this push touch what goes into the image?)
        id: c
        env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The trigger's own path list, read from this file: one list, never a second copy to keep in step.
          # The block runs to the next key at indent 4 or less; every line in it must be `      - "glob"`: anything else
          # (a comment at any indent, a blank line, another quote style) stops the step, never a shorter list.
          globs=$(awk '/^    paths:/{p=1;next} p&&/^ {0,4}[^ #]/{exit} p{ if ($0 ~ /^      - "[^"]+"$/) { sub(/^      - "/,""); sub(/"$/,""); print } else { print "BAD [" $0 "]" } }' .github/workflows/skeleton.yml)
          [ -n "$globs" ] || { echo "::error::no path list read from skeleton.yml"; exit 1; }
          if printf '%s\n' "$globs" | grep -q '^BAD '; then echo "::error::the paths block must hold only lines of the form - \"glob\": $(printf '%s\n' "$globs" | grep '^BAD ' | head -1)"; exit 1; fi
          # deploy/ is in the trigger for job deploy-synth only (PF-8a); it never goes into the image.
          globs=$(printf '%s\n' "$globs" | grep -v '^deploy/')
          # first_hit <files>: the first file an image glob matches. bash's * crosses /, so each glob matches a superset of
          # GitHub's; GitHub's **/ may also be no folder at all (p5/**/*.ts matches p5/transforms.ts), so each glob is also
          # tried with every **/ removed.
          first_hit() { local f g; while IFS= read -r f; do [ -n "$f" ] || continue
            while IFS= read -r g; do [[ "$f" == $g || "$f" == ${g//\*\*\//} ]] && { printf '%s' "$f"; return; }; done <<< "$globs"
          done <<< "$1"; }
          # PF-8a: a PR whose whole change touches no image path (deploy/ only, with its records) builds no image: GitHub
          # started this workflow for job deploy-synth. Judged against the base as the event fired; main's newer files
          # only make the list longer (a full run). An unreadable change goes on to the checks below.
          if [ -n "$BASE" ] && pr=$(git fetch -q --no-tags --depth=1 origin "$BASE" "$AFTER" 2>/dev/null && git diff --no-renames --name-only "$BASE" "$AFTER") \
             && [ -n "$pr" ] && [ -z "$(first_hit "$pr")" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Skeleton not run: this PR changes none of the image's paths (job deploy-synth checks deploy/)." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          # Only a later push to an open PR is judged by its own commits; opened, reopened, ready and by hand always run.
          if [ "$ACTION" != synchronize ] || [ -z "$BEFORE" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "full run ($ACTION)"; exit 0; fi
          # A push that cannot be read (a rewritten branch) runs in full.
          if ! files=$(git fetch -q --no-tags --depth=1 origin "$BEFORE" "$AFTER" 2>/dev/null && git diff --no-renames --name-only "$BEFORE" "$AFTER"); then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "full run: $BEFORE..$AFTER could not be read"; exit 0; fi
          hit=$(first_hit "$files")
          if [ -n "$hit" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "full run: this push changed $hit"; exit 0; fi
          # The skip stands only on a proven earlier head: this workflow's pull_request run at BEFORE concluded success
          # (a skip there was itself proven the same way). Red, cancelled, replaced, skipped (draft) or unreadable: full run.
          # gh prints an error body on stdout: anything but a plain number (an error, a rate limit, nothing) counts as 0.
          prev=$(gh api "repos/$REPO/actions/workflows/skeleton.yml/runs?head_sha=$BEFORE&event=pull_request&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || prev=0
          case "$prev" in ''|*[!0-9]*) prev=0;; esac
          if [ "$prev" -lt 1 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "full run: no green skeleton run at the earlier head ${BEFORE:0:9}"; exit 0; fi
          echo "run=false" >> "$GITHUB_OUTPUT"
          msg="Skeleton not run: this push (${BEFORE:0:9}..${AFTER:0:9}) changed none of the image's paths, only: $(printf '%s' "$files" | paste -sd ',' - | cut -c1-300); the image was proven green at ${BEFORE:0:9}."
          echo "$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: build the image (clean clone, no cache)
        if: steps.c.outputs.run == 'true'
        run: docker compose -f "$COMPOSE" build --pull --no-cache

      - name: start PostgreSQL, apply the migrations, start the app (waits until /api/health is 200)
        if: steps.c.outputs.run == 'true'
        run: |
          docker compose -f "$COMPOSE" up -d --no-build --wait --wait-timeout 180 || { docker compose -f "$COMPOSE" ps -a; docker compose -f "$COMPOSE" logs --tail 80; exit 1; }
          docker compose -f "$COMPOSE" logs migrate | tail -2
          docker compose -f "$COMPOSE" ps -a

      - name: smoke journey (health, first page, me once PF-4 is on main, non-root, no secret)
        if: steps.c.outputs.run == 'true'
        run: |
          # Keyed on PF-4's own file (the sign-in and /api/platform/me), not on api/src/platform/ (PF-3 creates it first).
          [ -f "$S/api/src/features/platform-identity.ts" ] && export PLATFORM_ME=required
          bash "$S/tools/skeleton-smoke.sh" "http://127.0.0.1:$SKELETON_PORT" --image studio-skeleton:test | tee smoke.txt
          exit "${PIPESTATUS[0]}"

      - name: seeded fail (database stopped; the smoke script must fail on health)
        if: steps.c.outputs.run == 'true'
        run: |
          docker compose -f "$COMPOSE" stop db
          if bash "$S/tools/skeleton-smoke.sh" "http://127.0.0.1:$SKELETON_PORT" > seeded.txt; then cat seeded.txt; echo "::error::the smoke script passed with the database stopped"; exit 1; fi
          cat seeded.txt
          grep -q '^FAIL  health' seeded.txt || { echo "::error::the smoke script failed, but not on health"; exit 1; }
          echo "seeded fail caught: the smoke script failed on health with the database stopped" | tee -a "$GITHUB_STEP_SUMMARY"
          sed -n 's/^/    /p' smoke.txt >> "$GITHUB_STEP_SUMMARY"

      - name: seeded fail (an image with a key in its environment and running as root; the image checks must fail)
        if: steps.c.outputs.run == 'true'
        run: |
          # Made-up values in the shapes the scan knows; never a real key.
          printf 'FROM studio-skeleton:test\nUSER root\nENV SEEDED_SIGNING_KEY=made-up-value DB_URL=postgresql://u:made-up@db/x\n' | docker build -q -t studio-skeleton:seeded - >/dev/null
          bash "$S/tools/skeleton-smoke.sh" "http://127.0.0.1:$SKELETON_PORT" --image studio-skeleton:seeded > seeded-image.txt || true
          grep -E '^(FAIL|PASS)  (non-root|no secret)' seeded-image.txt
          # One check per line (P-376 (3)): bash -e passes over a failed command inside an && list.
          if ! grep -q '^FAIL  non-root' seeded-image.txt; then echo "::error::the non-root check passed an image running as root"; exit 1; fi
          if ! grep -q '^FAIL  no secret' seeded-image.txt; then echo "::error::the secret scan passed an image with a key in its environment"; exit 1; fi
          echo "seeded fail caught: root user and a key in the environment" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: app log on failure
        if: failure() && steps.c.outputs.run == 'true'
        run: docker compose -f "$COMPOSE" logs --tail 200 app migrate

      - name: stop and remove (containers, network, the database volume)
        if: always() && steps.c.outputs.run == 'true'
        run: docker compose -f "$COMPOSE" down -v --remove-orphans

  # PF-8a: the Canadian estate as code (deploy/cdk). Synth needs no AWS account, and this job has no AWS credentials:
  # no secret, no OpenID Connect role, metadata lookups off. Runs its steps only when the PR changes deploy/ (or this file).
  deploy-synth:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    defaults:
      run:
        working-directory: deploy/cdk
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: changes (does this PR touch deploy/?)
        id: c
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          AFTER: ${{ github.event.pull_request.head.sha }}
        run: |
          # By hand, or when the change cannot be read: run. Main's newer files only make the list longer (a run).
          if [ -z "$BASE" ] || ! files=$(git fetch -q --no-tags --depth=1 origin "$BASE" "$AFTER" 2>/dev/null && git diff --no-renames --name-only "$BASE" "$AFTER"); then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "run (by hand, or the change could not be read)"; exit 0; fi
          if printf '%s\n' "$files" | grep -qE '^(deploy/|\.github/workflows/skeleton\.yml$)'; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "run: deploy/ changed"; exit 0; fi
          echo "run=false" >> "$GITHUB_OUTPUT"; echo "deploy-synth not run: this PR changes nothing under deploy/." | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        if: steps.c.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: deploy/cdk/package-lock.json

      - name: install (the CDK tree's own lockfile, no install scripts)
        if: steps.c.outputs.run == 'true'
        run: npm ci --ignore-scripts

      - name: type check
        if: steps.c.outputs.run == 'true'
        run: npm run typecheck

      - name: cdk synth (no AWS credentials)
        if: steps.c.outputs.run == 'true'
        run: |
          # Fails the job if any AWS credential reached it: synth must work without one.
          if env | grep -qE '^AWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY|SESSION_TOKEN|PROFILE|ROLE_ARN|WEB_IDENTITY_TOKEN_FILE)='; then echo "::error::an AWS credential is set in deploy-synth"; exit 1; fi
          npx cdk synth --quiet
          ls cdk.out/*.template.json

      - name: assertion tests (region guard, database, buckets, availability)
        if: steps.c.outputs.run == 'true'
        run: npm test

      - name: npm audit (no high finding in the CDK tree)
        if: steps.c.outputs.run == 'true'
        run: npm audit --omit=dev --audit-level=high
