# Cycle timeline (founder A244; ENF-783b, P-783 (2)): product/tools/cycle-timeline.py prints the Lead's 07:00 -> 07:00 IST
# cycle view. Its tests run the tool as `python3 -I` on a Sample 15-row plan with GitHub answered from a file and a
# fixed clock, and check the Lead's real cycle-plan.json still parses (15 rows, 8 by 19:00). Runs only when the tool,
# its test, its fixtures, the plan or this file change. Advisory (not a Mergify condition). Read-only, standard
# library, under 1 minute, US$0. Also runs founder-report.py's tests (ENF-783c, A260): it wraps the timeline in the founder's
# fixed report template, so a change to either is checked against both.
name: cycle-timeline
on:
  pull_request:
    # SPD-2 item 5 (b): a draft runs only the light checks (ci's guard, pr-rules, module-cards); this runs on ready-for-review.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/cycle-timeline.py"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/test_cycle_timeline.py"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/fixtures/cycle-timeline/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/founder-report.py"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/test_founder_report.py"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/fixtures/founder-report/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/cycle-plan.json"
      - ".github/workflows/cycle-timeline.yml"
permissions:
  contents: read
concurrency:
  group: cycle-timeline-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ !startsWith(github.event.pull_request.head.ref, 'mergify/') }}   # SPD-2 item 5: a newer push supersedes; a merge-queue batch never
jobs:
  cycle-timeline:
    if: "${{ !github.event.pull_request.draft || startsWith(github.event.pull_request.head.ref, 'mergify/') }}"   # SPD-2 item 5 (b): not on a draft (a merge-queue batch is a draft and still runs it)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: unit tests (Sample plan, no network)
        run: python3 -I ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/test_cycle_timeline.py
      - name: founder report tests (ENF-783c; Sample, no network)
        run: python3 -I ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/test_founder_report.py
