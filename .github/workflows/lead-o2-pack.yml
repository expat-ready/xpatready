# MEASUREMENT ONLY, branch claude/lead-o2-pack, never merged (founder through Lead 5, 23 Nov; Pilot A, US$0): pack-config.json says
# which shards (8 at most a push), how many suites at once and which repeat; at most 2 machines at once. Read-only token, no secrets.
# GitHub offers workflow_dispatch only for a workflow file on the default branch, so it runs on a push that changes the
# marker file pack-go (as claude/lead-o-ci-measure ran on a push).
name: lead-o2-pack
on:
  push:
    branches: [claude/lead-o2-pack]
    paths: [pack-pilot/pack-go]
permissions: { contents: read }
concurrency: { group: lead-o2-pack, cancel-in-progress: false }
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs: { shards: "${{ steps.c.outputs.shards }}", ks: "${{ steps.c.outputs.ks }}", runs: "${{ steps.c.outputs.runs }}" }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - id: c
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          c = json.load(open("pack-pilot/pack-config.json"))
          sh, ks, r = c["shards"], c["at_once"], c["repeat"]
          assert sh and all(type(x) is int and 1 <= x <= 24 for x in sh) and len(set(sh)) == len(sh)
          assert ks and all(type(x) is int and 1 <= x <= 3 for x in ks) and type(r) is int and 1 <= r <= 3 and len(sh) * len(ks) <= 8
          print("shards=" + json.dumps(sh)); print("ks=" + json.dumps(ks)); print("runs=" + json.dumps([r]))
          PY
  pack:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
        k: ${{ fromJSON(needs.plan.outputs.ks) }}
    env:
      P: ai-workers/problem-1-pathway-setup-and-form-filling/product
      S: ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: bash "$P/tools/cloud-setup.sh"
      - run: cd "$S" && ./node_modules/.bin/playwright install chromium
      - name: the shard, ${{ matrix.k }} suites at once
        run: python3 pack-pilot/pack-run.py ${{ matrix.shard }} 24 ${{ matrix.k }} "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "pack-s${{ matrix.shard }}-k${{ matrix.k }}-run${{ matrix.run }}", path: "${{ runner.temp }}/pack/*.txt", retention-days: 7 }
