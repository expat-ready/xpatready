# PF-8a (map row 1; tech gate entry 8): the Canadian estate as code is synthesized and its assertion tests run, with no
# AWS account, key or repository secret (synth needs none; P-551). Its own package and lockfile under studio/deploy/cdk;
# the studio's install, suites and parts in ci.yml do not change.
# Report-only (P-717 (b), P-772 (a), Lead 8 21 Nov): this check is in no Mergify queue or merge condition and no required
# check in the ruleset, and it has no merge_group trigger, until it has run clean for 24 h or 10 PR runs; then the tech
# lead makes it required by its own PR. When: a ready pull request that changes the CDK package, compose.test.yml
# (the database version the tests compare against) or this file (P-371 (1)); and every push to main, with no path
# filter, so main's head always has its own run for the cloud lines to cite (QA-645, P-339) and a merge combination
# that breaks the synth shows on main. The push run starts after the merge: it adds nothing to a pull request or to a
# merge-queue batch, so no batch waits for it. Still no secret, key or token: main's code only, read-only.
# Known effect: a failed push run is a failed check on main's head, so the board's "main CI" item turns red
# (cockpit-data.py), though the check stays report-only; the audit step can do that on a newly published advisory with
# no code change. Re-run the failed part first (P-371); a real break of the synth on main is what this run is for.
# US$0 (public repository), no model spend.
name: deploy-synth
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/deploy/cdk/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/deploy/compose.test.yml"
      - ".github/workflows/deploy-synth.yml"
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # One group per pull request (as before), one per pushed commit: two pushes to main never share a group, so a
  # waiting push run is never replaced by a newer one (P-371: no run on main is cancelled).
  group: deploy-synth-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false
jobs:
  deploy-synth:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/deploy/cdk
    env:
      CDK_DISABLE_CLI_TELEMETRY: "true"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/deploy/cdk/package-lock.json
      - name: install (the package's own lockfile, exact pins; no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: no high finding in the shipped tree (npm audit --omit=dev --audit-level=high)
        run: npm audit --omit=dev --audit-level=high
      - name: synth both stacks from a clean checkout (the app alone, no CLI, so no STS account lookup; no AWS keys)
        run: npm run synth
      - name: assertion tests (node --test; each check passes on the real stacks and fails on a broken one)
        run: npm test
