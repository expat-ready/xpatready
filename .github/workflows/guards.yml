# The eight guards of 6 Nov and B134's label sweep (founder, ~03:00 IST: "make them hard rules"): every test passes, and each test fails with
# its guard switched off (product/tools/check-guards.sh --mutate). Runs only when a guard, its test or a file it reads
# changes; separate from ci.yml (owned by the flow-fix lane) and not a merge condition. About 20-35 minutes with the mutation rows (it was about 1 minute on 6 Nov), US$0.
name: guards
on:
  pull_request:
    # SPD-2 item 5 (b): a draft runs only the light checks (ci's guard, pr-rules, module-cards); this runs on ready-for-review.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".claude/settings.json"
      - ".claude/skills/lead/**"
      - ".claude/skills/next/**"
      - ".claude/skills/qa/**"
      - ".github/workflows/comment-run.yml"
      - ".github/workflows/label-guard.yml"
      - ".github/workflows/nightly.yml"
      - ".github/workflows/guards.yml"
      - ".github/workflows/pr-rules.yml"   # E5: check-cleanup-pr.sh reads it
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/design/waves.tsv"   # B204 guard 28 (check-waves.sh)
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/design/waves.md"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/tools/isolated.sh"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/tools/test-copies.sh"
      - ".mergify.yml"   # P-785 (2) step 2: check-mergify-scopes.sh reads it (every PR once #2445 puts it in ci)
      - "CONTRIBUTING.md"   # P-785 (2) step 4: check-contributing.sh reads these three
      - ".github/pull_request_template.md"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/tools/item-proof.mjs"
permissions:
  contents: read
concurrency:
  group: guards-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ !startsWith(github.event.pull_request.head.ref, 'mergify/') }}   # SPD-2 item 5: a newer push supersedes; a merge-queue batch never
jobs:
  guards:
    if: "${{ !github.event.pull_request.draft || startsWith(github.event.pull_request.head.ref, 'mergify/') }}"   # SPD-2 item 5 (b): not on a draft (a merge-queue batch is a draft and still runs it)
    runs-on: ubuntu-latest
    timeout-minutes: 45   # CI-PRE (19 Nov): about 150 mutation rows, each re-running a test file; the run reached the old limit of 10.
                          # ENF-758 (20 Nov): runs took 20-27 min before its 25 rows (~25 s each on a runner); at 30 the run was cancelled mid-way
    steps:
      - uses: actions/checkout@v4
      - name: zsh (isolated.sh is a zsh script)
        # P-214 (11 Nov 2026): when the runner cannot reach Ubuntu's servers, take zsh from the image's Homebrew.
        run: |
          if ! command -v zsh; then
            sudo apt-get update -qq || true
            if ! sudo apt-get install -y -qq zsh; then
              HOMEBREW_NO_AUTO_UPDATE=1 /home/linuxbrew/.linuxbrew/bin/brew install --quiet zsh
              sudo ln -sf "$(/home/linuxbrew/.linuxbrew/bin/brew --prefix)/bin/zsh" /usr/bin/zsh
            fi
          fi
      - name: focus-truth.py's tests (ENF-733b, Sample fixtures, a few seconds)
        run: python3 -I ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/test_focus_truth.py
      - name: every guard's test, and each fails without its guard
        # 23 Nov: one at a time the rows passed 45 min (run 45157663648: 306 of 363 done). Four parts side by side, one per
        # processor, every row in exactly one part; the step fails if any part does.
        run: |
          T=ai-workers/problem-1-pathway-setup-and-form-filling/product/tools; pids=(); bad=0
          for i in 1 2 3 4; do bash "$T/check-guards.sh" --mutate --part "$i/4" > "$RUNNER_TEMP/part$i.log" 2>&1 & pids+=($!); done
          for i in 1 2 3 4; do wait "${pids[$((i - 1))]}" || { bad=1; echo "::error::guards part $i failed"; }; echo "== part $i"; cat "$RUNNER_TEMP/part$i.log"; done
          exit $bad
