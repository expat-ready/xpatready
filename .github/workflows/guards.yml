# The eight guards of 6 Nov and B134's label sweep (founder, ~03:00 IST: "make them hard rules"): every test passes, and each test fails with
# its guard switched off (product/tools/check-guards.sh --mutate). Runs only when a guard, its test or a file it reads
# changes; separate from ci.yml (owned by the flow-fix lane) and not a merge condition. In parts since 23 Nov (8 since 28 Nov) (one run took over 45 minutes with 363 rows), US$0.
name: guards
on:
  pull_request:
    # SPD-2 item 5 (b): a draft runs only the light checks (ci's guard, pr-rules, module-cards); this runs on ready-for-review.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:   # LR-044 (lab A2, 28 Nov): every file a guard test or the mutation copy reads, so a change there runs them
      - ".claude/settings.json"
      - ".claude/skills/**"   # check-model-rule.sh reads every skill and agent file
      - ".claude/agents/**"
      - ".github/workflows/**"   # the mutation copy holds every workflow; tests parse ci, pr-suites, queue-gate, lead-read and more
      - ".github/workflows/studio-audit.yml"   # named for check-npm-audit-report.sh (its "guarded" case)
      - ".github/workflows/red-on-old.yml"   # named for check-red-on-old.sh (its "guarded" case)
      - ".github/pull_request_template.md"
      - ".mergify.yml"
      - "CONTRIBUTING.md"
      - "CLAUDE.md"   # check-model-rule.sh
      - "AGENTS.md"
      - "REVIEW.md"   # check-review-converges.sh
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/WAY-OF-WORKING.md"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/focus-list.md"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/rules/account-switch.md"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/state/items.schema.json"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/screens/B119/**"   # check-mergify-scopes.sh runs its check-queue-rules.py
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/design/waves.tsv"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/design/waves.md"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/design/night-checklist.json"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/design/full-power-plan-2026-11-17.md"   # check-plan-watch.sh
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/design/engineering-approved-setup.json"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/tools/**"
      - "packages/xfa-engine/fixtures/synthetic/*.pdf"   # guard 11 reads the real bytes
      - "packages/xfa-engine/src/__tests__/fixtures/*.pdf"
permissions:
  contents: read
concurrency:
  group: guards-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ !startsWith(github.event.pull_request.head.ref, 'mergify/') }}   # SPD-2 item 5: a newer push supersedes; a merge-queue batch never
jobs:
  # Lead 5 (23 Nov): 363 mutation rows no longer fit one 45-minute job (run 137634775496 was cancelled at the limit), so
  # the rows run in N parts (check-guards.sh --mutate --part i/N: the plain tests in part 1, every N-th row in each), and
  # the job named guards, run always(), is green only when every part succeeded: a failed, cancelled or skipped part is
  # red. check-guard-parts.sh proves the parts cover every test and row exactly once and checks this wiring.
  # Lab lane, 27 Nov (Lead 4 on #3902): 4 → 6 parts. Part 1 (plain tests, about 10 min, plus its share of rows) ran
  # 37-44 min and hit the 45-minute limit on #3893, #3896 and #3902; parts 2-4 ran 33-41 min. About 140 min of rows over
  # 6 parts is about 23 min each, so part 1 is about 33 min and the others about 23, each well under the limit.
  # Lab A2 (LR-044, 28 Nov): 6 → 8 parts. On main the parts ran 21-33 min and part 1 38 min (run 46074476375); A1 and A5
  # add about 43 rows. 8 parts: each row part about 3/4 of before, so every part stays under 40 minutes with room to grow.
  part:
    if: "${{ !github.event.pull_request.draft || startsWith(github.event.pull_request.head.ref, 'mergify/') }}"   # SPD-2 item 5 (b): not on a draft (a merge-queue batch is a draft and still runs it)
    name: guards part ${{ matrix.part }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 45   # CI-PRE (19 Nov) and ENF-758 (20 Nov): the limit stays; the parts keep each run well under it
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: zsh (isolated.sh is a zsh script)
        # P-214 (11 Nov 2026): when the runner cannot reach Ubuntu's servers, take zsh from the image's Homebrew.
        run: |
          if ! command -v zsh; then
            sudo apt-get update -qq || true
            if ! sudo apt-get install -y -qq zsh; then
              HOMEBREW_NO_AUTO_UPDATE=1 /home/linuxbrew/.linuxbrew/bin/brew install --quiet zsh
              sudo ln -sf "$(/home/linuxbrew/.linuxbrew/bin/brew --prefix)/bin/zsh" /usr/bin/zsh
            fi
          fi
      - name: focus-truth.py's tests (ENF-733b, Sample fixtures, a few seconds)
        if: ${{ matrix.part == 1 }}
        run: python3 -I ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/test_focus_truth.py
      - name: this part's guard tests and mutation rows (each test fails without its guard)
        run: bash ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/check-guards.sh --mutate --part ${{ matrix.part }}/8
  guards:
    needs: part
    if: "${{ always() && (!github.event.pull_request.draft || startsWith(github.event.pull_request.head.ref, 'mergify/')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every part succeeded (a failed, cancelled or skipped part is red)
        env:
          PARTS: ${{ needs.part.result }}
        run: |
          echo "guards parts: $PARTS"
          [ "$PARTS" = success ] || { echo "::error::a guards part did not succeed ($PARTS): see the guards part jobs"; exit 1; }
