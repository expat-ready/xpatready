# npm audit of the studio package, REPORT ONLY (P-776: a generated lockfile over the 800 lines comes with npm ci and npm audit
# in CI on that package; Lead 25, 24 Nov). npm ci itself runs in ci.yml's parts (tools/cloud-setup.sh). Here: the lockfile as it
# stands is installed without its scripts (it must be in step with package.json), then audited, the PR's beside the base's;
# the count goes to the summary (npm-audit-report.py). Main has findings, so nothing here fails a PR: every step after checkout
# is continue-on-error, no Mergify condition and no ruleset names it. Read-only token, no secrets, package scripts off (--ignore-scripts). US$0.
# Test: product/tools/check-npm-audit-report.sh.
name: studio-audit
on:
  pull_request:
    paths:
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/package.json"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/package-lock.json"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/.npmrc"
      - ".github/workflows/studio-audit.yml"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/npm-audit-report.py"
concurrency:
  group: studio-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: "${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'mergify/') }}"
permissions: {}
jobs:
  audit:
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'mergify/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    env:
      P: ai-workers/problem-1-pathway-setup-and-form-filling/product
      S: ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 2, persist-credentials: false }   # the test merge and its first parent, the base
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        continue-on-error: true
        with: { node-version-file: .nvmrc }
      - id: ci
        name: npm ci (package scripts off)
        continue-on-error: true
        run: cd "$S" && npm ci --ignore-scripts --no-audit --no-fund
      - name: npm audit, this PR and its base (report only)
        continue-on-error: true
        env: { CI_OUTCOME: "${{ steps.ci.outcome }}" }
        run: |
          [ "$CI_OUTCOME" = success ] || echo "::warning title=npm audit (P-776, report only)::npm ci failed: the lockfile is not in step with package.json, or the registry did not answer" | tee -a "$GITHUB_STEP_SUMMARY"
          # Both sides in folders of their own: a committed .npmrc (offline, omit, another registry) must not change the count.
          for v in head base; do mkdir -p "$RUNNER_TEMP/$v"; done
          for f in package.json package-lock.json; do
            cp "$S/$f" "$RUNNER_TEMP/head/$f" || true
            git show "HEAD^1:$S/$f" > "$RUNNER_TEMP/base/$f" || true
          done
          for v in head base; do npm audit --prefix "$RUNNER_TEMP/$v" --package-lock-only --json --registry=https://registry.npmjs.org/ --offline=false --include=prod --include=dev --include=optional --include=peer > "$RUNNER_TEMP/$v.json" || true; done
          python3 -I "$P/tools/npm-audit-report.py" --head "$RUNNER_TEMP/head.json" --base "$RUNNER_TEMP/base.json" --summary "$GITHUB_STEP_SUMMARY" || true
