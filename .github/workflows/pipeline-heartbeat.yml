# Pipeline heartbeat (CK-2, founder asks A151 and A154, 17 Nov 2026): outside every session, the set-up is in force
# (CK-1, conformance-check.py) and the pipeline keeps moving (pipeline-heartbeat.py; thresholds and red_rule in
# product/design/engineering-approved-setup.json › heartbeat). A red run mails the owner; the reason is in the job
# summary; the result is the artifact the next run and the board read. One job, read-only, never cancelled, 5 min, US$0.
name: pipeline-heartbeat
on:
  schedule:
    # re-registered 19 Nov after the org move (GitHub dropped scheduled runs from 18 Nov 10:00 UTC)
    - cron: "11,41 * * * *"   # every 30 min, off the top of the hour (GitHub delays :00 schedules most)
  workflow_dispatch:
  # OS-83 (tech lead 26 Nov, founder ask A400: every watcher runs inside the pipeline): GitHub ran the schedule above
  # only every 8-11 hours (18-26 Nov), so a merge to main and a ci run on main (a full run) start it too. Such an event
  # run judges and shows red, but its result goes up as "pipeline-heartbeat-event", which the next run's read_previous
  # never reads (the board reads either): GitHub mails a red run to whoever started it (mostly mergify[bot]), so only a
  # scheduled run, whose red mails the owner, marks an alarm as seen or escalated (review of #3817, M1). So while an alarm
  # is open every push and full run on main is red too, mailing nobody; the escalation mail waits for the next scheduled
  # run. No issue_comment: anyone can comment, and while conformance fails every run is red (M2). The concurrency group
  # keeps one run and one waiting: a newer event can replace a waiting scheduled run, and the next schedule makes up for
  # it. Manifest heartbeat.events_required; test_conformance_check.py.
  push:
    branches: [main]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: pipeline-heartbeat
  cancel-in-progress: false
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      P: ai-workers/problem-1-pathway-setup-and-form-filling/product
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml==6.0.3   # conformance-check reads the YAML files
      - name: set-up conformance (CK-1) on main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/heartbeat"
          python3 -I "$P/tools/conformance-check.py" --root . --github --json "$RUNNER_TEMP/heartbeat/conformance.json" --md "$GITHUB_STEP_SUMMARY" || true
      - name: heartbeat (red on a change, red_rule)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I "$P/tools/pipeline-heartbeat.py" --conformance "$RUNNER_TEMP/heartbeat/conformance.json" --json "$RUNNER_TEMP/heartbeat/heartbeat.json" --md "$GITHUB_STEP_SUMMARY"
      - name: result for the next run (scheduled and by-hand runs only, OS-83) and the board (every run)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'pipeline-heartbeat' || 'pipeline-heartbeat-event' }}
          path: ${{ runner.temp }}/heartbeat/
          retention-days: 3
          if-no-files-found: warn
