# Pipeline heartbeat (CK-2, founder asks A151 and A154, 17 Nov 2026): outside every session, the set-up is in force
# (CK-1, conformance-check.py) and the pipeline keeps moving (pipeline-heartbeat.py; thresholds and red_rule in
# product/design/engineering-approved-setup.json › heartbeat). A red run mails the owner; the reason is in the job
# summary; the result is the artifact the next run and the board read. One job, read-only, never cancelled, 5 min, US$0.
name: pipeline-heartbeat
on:
  schedule:
    - cron: "11,41 * * * *"   # every 30 min, off the top of the hour (GitHub delays :00 schedules most)
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pipeline-heartbeat
  cancel-in-progress: false
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      P: ai-workers/problem-1-pathway-setup-and-form-filling/product
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OUT: ${{ runner.temp }}/heartbeat
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyYAML (conformance-check reads the YAML files)
        run: pip install --quiet pyyaml==6.0.3
      - name: set-up conformance (CK-1) on main
        run: |
          mkdir -p "$OUT"
          python3 -I "$P/tools/conformance-check.py" --root . --github --json "$OUT/conformance.json" --md "$GITHUB_STEP_SUMMARY" || true
      - name: heartbeat (red on any alarm)
        run: python3 -I "$P/tools/pipeline-heartbeat.py" --conformance "$OUT/conformance.json" --json "$OUT/heartbeat.json" --md "$GITHUB_STEP_SUMMARY"
      - name: result for the board
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-heartbeat
          path: ${{ runner.temp }}/heartbeat/
          retention-days: 3
          if-no-files-found: warn
