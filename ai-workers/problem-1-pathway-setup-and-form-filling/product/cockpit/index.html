:root{

    --st-built:#a68cf0; --st-built-soft:#2a2045; --st-proven:#4cc283; --st-proven-soft:#123222;
  }
}
:root[data-theme="dark"]{

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);font-variant-numeric:tabular-nums;overflow-x:hidden}

.box{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}

/* 5 architecture */
function rArch(){
  return section("07","arch","Product architecture","Each module, filled by the share of its Release 1 capabilities at qa Works (dark) and merged (light). Tap a module for its capabilities.",
    '<div class="svgwrap" id="archsvg"></div><div class="legend"><span class="pill t-good">qa Works share</span><span class="pill t-prog">merged share</span></div><div class="modlist" id="modlist"><p class="small muted">Tap a module to list its capabilities.</p></div>');
}
function drawArch(){
  var host=document.getElementById("archsvg");if(!host)return;
  var M=D.architecture.modules,W=host.clientWidth||360,narrow=W<620;
  var mods=M.filter(function(m){return m.kind==="module";}),layer=M.filter(function(m){return m.kind==="layer";}),low=M.filter(function(m){return m.kind!=="module"&&m.kind!=="layer";});
  var cols=narrow?2:mods.length,gap=10,bw=(W-gap*(cols-1))/cols,bh=88,r1=Math.ceil(mods.length/cols);
  var y=0,s="",H;
  function box(m,x,y,w,h){var d=m.done_share||0,g=m.merged_share||0,lbl=m.total+" capabilities \u00b7 "+Math.round(d*100)+"% Works";
    var o='<g data-mod="'+esc(m.id)+'" tabindex="0" role="button" aria-label="'+esc(m.name+", "+lbl+"; press to list its capabilities")+'" style="cursor:pointer">';
    o+='<rect x="'+(x+.75)+'" y="'+(y+.75)+'" width="'+(w-1.5)+'" height="'+(h-1.5)+'" rx="6" fill="var(--panel2)" stroke="'+(m.kind==="gap"?"var(--wait)":"var(--line)")+'" stroke-dasharray="'+(m.kind==="gap"?"4 3":"")+'"/>';
    o+='<rect x="'+(x+1)+'" y="'+(y+h-10)+'" width="'+Math.max(0,(w-2)*g)+'" height="9" fill="var(--prog-soft)"/><rect x="'+(x+1)+'" y="'+(y+h-10)+'" width="'+Math.max(0,(w-2)*d)+'" height="9" fill="var(--good)"/>';
    var c=m.counts||{};o+='<svg x="'+(x+8)+'" y="'+y+'" width="'+Math.max(0,w-14)+'" height="'+(h-10)+'">';
    o+='<text x="0" y="18" font-size="13" font-weight="600" fill="var(--ink)">'+esc(m.name)+'</text>';
    o+='<text x="0" y="36" font-size="11.5" fill="var(--ink2)" style="font-family:var(--mono)">'+esc(m.total)+' capabilities \u00b7 '+Math.round(d*100)+'% Works</text>';
    o+='<text x="0" y="52" font-size="11" fill="var(--ink3)">'+esc(Math.round(g*100)+"% merged \u00b7 "+(c["In PR"]||0)+" in PR")+'</text>';
    o+='<text x="0" y="67" font-size="11" fill="var(--ink3)">'+esc((c["Shaped"]||0)+" shaped \u00b7 "+(c["Not shaped"]||0)+" not shaped")+'</text></svg></g>';return o;}
  mods.forEach(function(m,i){var r=Math.floor(i/cols),c=i%cols;s+=box(m,c*(bw+gap),r*(bh+gap),bw,bh);});
  y=r1*(bh+gap);
  layer.forEach(function(m){s+=box(m,0,y,W,bh);y+=bh+gap;});
  var lc=narrow?1:low.length,lw=(W-gap*(lc-1))/lc;
  low.forEach(function(m,i){var r=Math.floor(i/lc),c=i%lc;s+=box(m,c*(lw+gap),y+r*(bh+gap),lw,bh);});
  H=y+Math.ceil(low.length/lc)*(bh+gap);
  host.innerHTML='<svg width="100%" viewBox="0 0 '+W+' '+H+'" role="group" aria-label="Modules of the product and their progress">'+s+'</svg>';
}

/* 13 improving */
function spark(xs,good){
  var W=200,H=40,pts=[],ys=xs.filter(function(x){return x!=null;});if(ys.length<2)return '<span class="muted small">too few points</span>';
  var mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);if(mx===mn){mx+=1;mn-=1;}
  xs.forEach(function(x,i){if(x!=null)pts.push((i*W/(xs.length-1)).toFixed(1)+","+(H-3-(x-mn)/(mx-mn)*(H-6)).toFixed(1));});
  var last=pts[pts.length-1].split(",");
  return '<svg width="100%" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:40px"><line x1="0" x2="'+W+'" y1="'+(H/2)+'" y2="'+(H/2)+'" stroke="var(--line)" stroke-dasharray="2 3"/><polyline points="'+pts.join(" ")+'" fill="none" stroke="var(--accent)" stroke-width="1.8" vector-effect="non-scaling-stroke"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="3" fill="var(--accent)"/></svg>';
}
function rImprove(){

    var arrow=t.dir==="up"?"rising":t.dir==="down"?"falling":t.dir==="flat"?"flat":"no comparison";

    h+='<div'+T("improving."+k)+'><div class="small">'+esc(t.label)+'</div><div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px"><span class="mono" style="font-size:20px;font-weight:600">'+nz(t.latest)+'</span>'+pill(arrow,tn)+'</div>'+spark(I.series[k],t.better)+'<div class="small muted">7-day average '+nz(t.this_week)+' against '+nz(t.week_before)+'</div></div>';});
