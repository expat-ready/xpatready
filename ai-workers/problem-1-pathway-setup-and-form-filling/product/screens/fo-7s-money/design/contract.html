<title>FO-7s0 contract table</title>
<!-- FO-7s0 DW2 (concept.md): one line per screen element: route under /api/front-office/money/* (public pay: /api/public/pay/*),
     permission key, the row that builds it, the refusal words the screen shows. A route no brief names is an "FO-7q addition"
     (a read) or a "Question" (a write), never invented. Open with ?plant=dw2 (an element with no route): the check must say FAIL.
     Sources: the money briefs FO-7b (lead-b-front-office), FO-7c, g, m, mv, p, q, r, t, ts, v on main, rows rev 16.33-16.53. -->
<style>

:root[data-theme="dark"]{--bg:#11151c;--card:#1a202b;--text:#e8edf5;--muted:#9aa6b8;--line:#2c3544;--warn:#f0b35a}

<h1>Contract table (FO-7s0)</h1>
<p>Paths after <code>/api/front-office/money</code> unless they start with <code>/api/</code>. "FO-7b route" = FO-7b names the behaviour but no path; the builder reads the path on <code>main</code>. Gaps G1-G23 and questions Q1-Q4 are listed in <code>concept.md</code>.</p>
